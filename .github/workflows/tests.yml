name: CPU research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            05-cpu-walkforward/requirements.txt
            04-jev-lora-and-cnn/requirements-training-cnn.txt
      - name: Install research dependencies
        run: python -m pip install -r 05-cpu-walkforward/requirements.txt
      - name: Install CPU-only PyTorch for checkpoint verification
        run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Pipeline, HTTP and protocol tests
        run: python -m unittest discover -s 01-jev-tsla-charts/tests -v
      - name: Statistical inference tests
        run: python -m unittest discover -s tests -v
      - name: Training preparation and checkpoint tests
        run: python -m unittest discover -s 04-jev-lora-and-cnn/tests -v
      - name: Walk-forward and causal feature tests
        run: python -m unittest discover -s 05-cpu-walkforward/tests -v
